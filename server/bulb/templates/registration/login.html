<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Login</title>
  <style>
    body { font-family: sans-serif; padding: 24px; max-width: 420px; margin: 0 auto; }
    input { width: 100%; padding: 10px; margin: 8px 0; }
    button { padding: 10px 16px; }
    .error { color: #b00; }
  </style>
</head>
<body>
  <h1>Login</h1>

  {% if form.errors %}
    <p class="error">Invalid username or password.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <label>Username</label>
    {{ form.username }}
    <label>Password</label>
    {{ form.password }}
    <button type="submit">Log in</button>
  </form>
  <p>
  Don't have an account?
  <a href="/register/">Register</a>
</p>
</body>
</html>
